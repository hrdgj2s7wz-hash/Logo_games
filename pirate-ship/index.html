<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07141d">
  <title>Пиратский корабль</title>
  <style>
    :root{color-scheme:dark;--ink:#f8edcf;--gold:#f2b84b;--panel:rgba(8,22,30,.9)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,serif;background:linear-gradient(180deg,#102b3b,#274653 48%,#102d39 49%,#07141d);background-attachment:fixed}button{font:inherit}.screen{min-height:100vh;position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(180deg,rgba(6,16,25,.1),rgba(6,16,25,.2) 45%,#07141d 100%),radial-gradient(ellipse at 50% 40%,rgba(238,177,82,.2),transparent 40%)}.screen:before{content:"";position:absolute;z-index:-1;left:-10%;bottom:0;width:120%;height:25%;background:repeating-radial-gradient(ellipse at 50% 100%,transparent 0 42px,rgba(77,151,164,.22) 44px 47px,transparent 49px 76px)}.intro{min-height:100vh;display:grid;place-items:center;padding:30px 18px;text-align:center}.intro-content{width:min(850px,100%);position:relative}.eyebrow{color:#ffe2a0;font:700 .8rem Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase}h1{margin:12px 0;color:#fff3d3;font-size:clamp(2.7rem,8vw,6rem);line-height:.95;text-shadow:0 4px #58361f,0 8px 24px #000}.copy{max-width:570px;margin:18px auto;color:#f4e7c7;font:1.05rem/1.6 Arial,sans-serif}.ship{width:min(700px,100%);margin:-4px auto -12px;filter:drop-shadow(0 20px 17px #0009);animation:bob 4s ease-in-out infinite}.ship svg{display:block;width:100%;height:auto}@keyframes bob{50%{transform:translateY(8px) rotate(.3deg)}}.btn{border:1px solid #ffe19a;border-radius:999px;padding:14px 25px;color:#291a0d;background:linear-gradient(#ffd77b,#d89432);box-shadow:0 5px #74431e,0 12px 24px #0006;font:700 1rem Arial,sans-serif;cursor:pointer}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.game-screen{display:none;min-height:100vh;padding:24px 14px 40px;background:#06131ddd}.game-screen.active{display:block}.hidden{display:none!important}.game{width:min(820px,100%);margin:auto;border:1px solid #ffe0a055;border-radius:18px;overflow:hidden;background:var(--panel);box-shadow:0 20px 55px #0008;backdrop-filter:blur(8px)}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;background:linear-gradient(120deg,#70401fbb,#192d32cc)}.head h2{margin:0;color:#ffe4a8;font-size:clamp(1.35rem,5vw,2rem)}.sound,.restart{padding:10px 13px;color:var(--ink);background:#ffffff19;border-color:#ffffff55;box-shadow:none;font-size:.85rem;white-space:nowrap}.content{padding:clamp(18px,4vw,30px)}.story{min-height:145px;padding:20px;border:1px solid #ffe2a026;border-radius:12px;background:#fff9e00a;font:1.02rem/1.7 Arial,sans-serif}.story h3{margin:0 0 10px;color:var(--gold);font:700 1.35rem Georgia,serif}.story p{margin:0}.inventory{margin-top:16px;padding:14px 16px;border:1px solid #7ac89155;border-radius:12px;background:#4b87571a;font: .95rem/1.6 Arial,sans-serif}.inventory h3{margin:0 0 8px;color:#a7e5a5;font:700 1rem Arial,sans-serif}.items{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}.items li{padding:5px 10px;border:1px solid #a7e5a555;border-radius:999px;color:#d3c7a8;background:#7ac8911a}.items li.added{animation:pop .55s cubic-bezier(.2,.8,.25,1.3) both}@keyframes pop{0%{opacity:0;transform:scale(.55) translateY(12px)}65%{opacity:1;transform:scale(1.12) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}.choices{display:grid;gap:11px;margin-top:20px}.choices .btn{width:100%;border-radius:10px;text-align:left}.restart{margin-top:20px}@media(max-width:520px){.head{padding:15px}.sound{padding:9px;font-size:.75rem}.ship{margin:5px auto 0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main>
    <section id="intro" class="screen intro" aria-label="Главная страница">
      <div class="intro-content">
        <p class="eyebrow">Текстовое приключение</p><h1>Пиратский<br>корабль</h1>
        <p class="copy">Туман скрывает старый корабль, а его трюм хранит тайну. Поднимайся на борт, собирай предметы и найди сокровище!</p>
        <div class="ship" aria-hidden="true"><svg viewBox="0 0 760 390" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="h" x2="0" y2="1"><stop stop-color="#8d552b"/><stop offset="1" stop-color="#321d18"/></linearGradient><linearGradient id="s" x2="1" y2="1"><stop stop-color="#f3e5bf"/><stop offset="1" stop-color="#ad9873"/></linearGradient></defs><circle cx="578" cy="86" r="37" fill="#ffe6ad" opacity=".8"/><path d="M40 280q150-35 300 0t420 0v110H0z" fill="#17505d"/><path d="M382 60v228M270 128v148M495 143v133M220 137h225M320 75h126M442 157h102" stroke="#39251a" stroke-width="11"/><path d="M381 77l-100 51h100zM390 84h48v42h-48zM270 143l-46 40h46zM279 145h48v38h-48zM495 166l-42 38h42zM504 166h42v38h-42z" fill="url(#s)" stroke="#75634c" stroke-width="3"/><path d="M386 60q39-13 71 2l-14 26q-29-13-57-3z" fill="#171717"/><circle cx="420" cy="68" r="7" fill="#eee1bf"/><path d="M112 273q148 14 272 6 146 8 276-24l-44 65q-226 35-433-1z" fill="url(#h)" stroke="#281914" stroke-width="8"/><path d="M140 283q227 24 496-13" fill="none" stroke="#d09a54" stroke-width="5"/><g fill="#f2bd55" stroke="#201512" stroke-width="5"><circle cx="270" cy="302" r="8"/><circle cx="321" cy="306" r="8"/><circle cx="372" cy="308" r="8"/><circle cx="423" cy="306" r="8"/><circle cx="474" cy="301" r="8"/></g></svg></div>
        <button id="start" class="btn">Начать</button>
      </div>
    </section>
    <section id="gameScreen" class="game-screen" aria-label="Игра">
      <div class="game"><header class="head"><h2>Пиратский корабль</h2><button id="sound" class="btn sound" type="button">🔊 Волны: вкл.</button></header>
        <div class="content"><div id="story" class="story" aria-live="polite"></div><aside class="inventory"><h3>🎒 Инвентарь</h3><ul id="items" class="items"><li>Пока пусто</li></ul></aside><div id="choices" class="choices"></div><button id="restart" class="btn restart hidden">Начать заново</button></div>
      </div>
    </section>
  </main>
  <script>
    const state={scene:"deck",inventory:[]};let ctx=null,nodes=[],soundOn=true;
    const scenes={
      deck:{title:"Палуба корабля",text:"Ты стоишь на мокрой палубе древнего пиратского корабля. Ветер пахнет солью и старым деревом. Туман наползает на мачты. Вдалеке видны капитанская каюта, трюм и нос корабля.",choices:[{text:"Осмотреть капитанскую каюту",next:"cabin"},{text:"Спуститься в трюм",next:"hold"},{text:"Подняться на нос корабля",next:"bow"}]},
      cabin:{title:"Капитанская каюта",text:"В каюте сыро и тихо. На столе лежит старый компас, а у сундука на полу поблёскивает металлический ключ.",choices:[{text:"Взять компас",next:"cabin",item:"Компас"},{text:"Взять ключ",next:"cabin",item:"Ключ"},{text:"Вернуться на палубу",next:"deck"}]},
      hold:{title:"Трюм",text:"В трюме пахнет плесенью и старым деревом. На полу лежит карта, завёрнутая в промокшую ткань. В дальнем углу стоит сундук с замком.",choices:[{text:"Поднять карту",next:"hold",item:"Карта сокровищ"},{text:"Осмотреть сундук",next:"chest"},{text:"Вернуться на палубу",next:"deck"}]},
      bow:{title:"Нос корабля",text:"На носу лежит золотой знак. На борту вырезана подсказка: «Сокровище ждёт того, кто найдёт ключ».",choices:[{text:"Забрать золотой знак",next:"bow",item:"Золотой знак"},{text:"Вернуться на палубу",next:"deck"}]},
      chest:{title:"Сундук капитана",text:"Сундук заперт. На тяжёлом замке видна царапина в форме старого ключа.",choices:[{text:"Открыть сундук ключом",next:"win",requires:"Ключ",deny:"Замок не поддаётся. Поищи ключ в капитанской каюте."},{text:"Вернуться в трюм",next:"hold"}]},
      win:{title:"Сокровище найдено!",text:"Ключ поворачивается в замке. В сундуке лежат золотые монеты и драгоценности. Ты нашёл сокровище и стал настоящим пиратом!",choices:[]}
    };
    async function startWaves(){if(!soundOn)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!ctx)ctx=new AC();if(ctx.state==="suspended")await ctx.resume();if(nodes.length)return;const buffer=ctx.createBuffer(1,ctx.sampleRate*3,ctx.sampleRate),d=buffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(.65+.35*Math.random());const noise=ctx.createBufferSource();noise.buffer=buffer;noise.loop=true;const filter=ctx.createBiquadFilter();filter.type="lowpass";filter.frequency.value=420;const gain=ctx.createGain();gain.gain.value=.095;const swell=ctx.createOscillator(),depth=ctx.createGain();swell.frequency.value=.12;depth.gain.value=.045;swell.connect(depth);depth.connect(gain.gain);noise.connect(filter);filter.connect(gain);gain.connect(ctx.destination);noise.start();swell.start();nodes=[noise,swell,filter,gain,depth]}catch(e){console.warn("Звук недоступен",e)}}
    function stopWaves(){nodes.forEach(n=>{try{if(n.stop)n.stop();n.disconnect()}catch(_){}});nodes=[]}
    function renderItems(added=null){const list=document.getElementById("items");list.replaceChildren();if(!state.inventory.length){const li=document.createElement("li");li.textContent="Пока пусто";list.append(li);return}state.inventory.forEach(item=>{const li=document.createElement("li");li.textContent=item;if(item===added)li.classList.add("added");list.append(li)})}
    function render(){const s=scenes[state.scene];document.getElementById("story").innerHTML=`<h3>${s.title}</h3><p>${s.text}</p>`;const choices=document.getElementById("choices");choices.replaceChildren();document.getElementById("restart").classList.toggle("hidden",s.choices.length>0);s.choices.forEach(c=>{const b=document.createElement("button");b.className="btn";b.textContent=c.text;b.onclick=()=>{if(c.requires&&!state.inventory.includes(c.requires)){alert(c.deny);return}let added=null;if(c.item&&!state.inventory.includes(c.item)){state.inventory.push(c.item);added=c.item}renderItems(added);state.scene=c.next;render()};choices.append(b)})}
    document.getElementById("start").onclick=async()=>{document.getElementById("intro").classList.add("hidden");document.getElementById("gameScreen").classList.add("active");render();await startWaves()};
    document.getElementById("sound").onclick=async e=>{soundOn=!soundOn;if(soundOn)await startWaves();else stopWaves();e.currentTarget.textContent=soundOn?"🔊 Волны: вкл.":"🔇 Волны: выкл."};
    document.getElementById("restart").onclick=()=>{state.scene="deck";state.inventory=[];renderItems();render()};
  </script>
</body>
</html>
